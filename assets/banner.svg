<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0d1322"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="accent-purple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="shield-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="50%" stop-color="#3b82f6" stop-opacity=".5"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".2"/></linearGradient><filter id="glow-cyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glow-purple" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="drop-shadow"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".7" stdDeviation="6"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-20px) translateX(15px);opacity:.7}}@keyframes dashMove{0%{stroke-dashoffset:100}}@keyframes rotateShield{0%{transform:rotate(0deg)}}@keyframes waveMotion{0%{d:path(&apos;M 0 320 Q 300 280 600 320 T 1200 320 L 1200 400 L 0 400 Z&apos;)}50%{d:path(&apos;M 0 310 Q 300 340 600 300 T 1200 310 L 1200 400 L 0 400 Z&apos;)}}.bg-grid{stroke:#1e293b;stroke-width:1;opacity:.35