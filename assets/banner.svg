<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1322" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="drop-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-20px) translateX(15px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes rotateShield {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes waveMotion {
      0% { d: path('M 0 320 Q 300 280 600 320 T 1200 320 L 1200 400 L 0 400 Z'); }
      50% { d: path('M 0 310 Q 300 340 600 300 T 1200 310 L 1200 400 L 0 400 Z'); }
      100% { d: path('M 0 320 Q 300 280 600 320 T 1200 320 L 1200 400 L 0 400 Z'); }
    }

    .bg-grid { stroke: #1e293b; stroke-width: 1; opacity: 0.35; }
    .pulse-circle { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 2s; }
    .particle-3 { animation: floatParticle 7s ease-in-out infinite 4s; }
    .animated-wire { stroke-dasharray: 8 8; animation: dashMove 12s linear infinite; }
    .shield-spin { animation: rotateShield 25s linear infinite; transform-origin: 1020px 200px; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Animated Grid -->
  <g class="bg-grid">
    <path d="M 0 40 L 1200 40 M 0 80 L 1200 80 M 0 120 L 1200 120 M 0 160 L 1200 160 M 0 200 L 1200 200 M 0 240 L 1200 240 M 0 280 L 1200 280 M 0 320 L 1200 320 M 0 360 L 1200 360" />
    <path d="M 100 0 L 100 400 M 200 0 L 200 400 M 300 0 L 300 400 M 400 0 L 400 400 M 500 0 L 500 400 M 600 0 L 600 400 M 700 0 L 700 400 M 800 0 L 800 400 M 900 0 L 900 400 M 1000 0 L 1000 400 M 1100 0 L 1100 400" />
  </g>

  <!-- Background Glowing Orbs (Dynamic elements in background) -->
  <circle cx="150" cy="100" r="180" fill="#06b6d4" opacity="0.12" filter="url(#glow-cyan)" class="pulse-circle" />
  <circle cx="1020" cy="200" r="220" fill="#8b5cf6" opacity="0.15" filter="url(#glow-purple)" class="pulse-circle" />

  <!-- Floating Particles & Network Nodes (Background) -->
  <g class="particle-1">
    <circle cx="220" cy="80" r="4" fill="#06b6d4" opacity="0.6" />
    <line x1="220" y1="80" x2="300" y2="140" stroke="#06b6d4" stroke-width="1" opacity="0.3" />
  </g>
  <g class="particle-2">
    <circle cx="880" cy="90" r="5" fill="#ec4899" opacity="0.6" />
    <circle cx="950" cy="60" r="3" fill="#3b82f6" opacity="0.7" />
    <line x1="880" y1="90" x2="950" y2="60" stroke="#8b5cf6" stroke-width="1" opacity="0.4" />
  </g>
  <g class="particle-3">
    <circle cx="1100" cy="310" r="4" fill="#3b82f6" opacity="0.6" />
  </g>

  <!-- Animated Tech Accent Lines -->
  <path d="M 50 350 L 350 350 L 450 390" stroke="url(#accent-cyan)" stroke-width="2" fill="none" opacity="0.5" class="animated-wire" />
  <path d="M 800 40 L 950 40 L 1050 80" stroke="url(#accent-purple)" stroke-width="2" fill="none" opacity="0.5" class="animated-wire" />

  <!-- Decorative Shield Icon Frame on Right (Background Graphic) -->
  <g transform="translate(1020, 200)">
    <!-- Rotating Ring -->
    <circle r="90" fill="none" stroke="url(#accent-cyan)" stroke-width="1.5" stroke-dasharray="12 6" class="shield-spin" opacity="0.6" />
    <!-- Shield Shape -->
    <path d="M 0 -50 L 40 -30 L 40 20 Q 0 60 -40 20 L -40 -30 Z" fill="url(#shield-grad)" stroke="#06b6d4" stroke-width="2" filter="url(#glow-cyan)" />
    <!-- Lock / Check Icon -->
    <path d="M -12 -5 L -3 5 L 14 -12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Dynamic Pills / Status Badges in Background/Middleground -->
  <g transform="translate(70, 50)" filter="url(#drop-shadow)">
    <rect width="135" height="28" rx="14" fill="#1e293b" stroke="#06b6d4" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#10b981" class="pulse-circle" />
    <text x="28" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">SOC 2 TYPE II</text>
  </g>
  <g transform="translate(218, 50)" filter="url(#drop-shadow)">
    <rect width="130" height="28" rx="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#3b82f6" class="pulse-circle" />
    <text x="28" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">ISO 27001:2022</text>
  </g>
  <g transform="translate(362, 50)" filter="url(#drop-shadow)">
    <rect width="115" height="28" rx="14" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#ec4899" class="pulse-circle" />
    <text x="28" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">OSCAL GRC</text>
  </g>

  <!-- FOREGROUND TEXT (Always crisp, top layer, unhidden) -->
  <g transform="translate(70, 140)" filter="url(#drop-shadow)">
    <!-- Main Title Tag / Badge -->
    <text x="0" y="0" fill="#06b6d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="3" text-transform="uppercase">
      SECURITY &amp; AUDIT COMPLIANCE ECOSYSTEM
    </text>

    <!-- Main Title Header -->
    <text x="0" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Compliance 🛡️
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="92" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" width="700">
      Curated List of Compliance Automation SaaS Platforms &amp; Open-Source GRC Tools
    </text>

    <!-- Feature Highlight Bullets -->
    <g transform="translate(0, 130)">
      <!-- Bullet 1 -->
      <g transform="translate(0, 0)">
        <circle cx="8" cy="-5" r="4" fill="#06b6d4" />
        <text x="20" y="0" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
          Continuous Control Monitoring
        </text>
      </g>
      <!-- Bullet 2 -->
      <g transform="translate(230, 0)">
        <circle cx="8" cy="-5" r="4" fill="#3b82f6" />
        <text x="20" y="0" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
          Automated Evidence Collection
        </text>
      </g>
      <!-- Bullet 3 -->
      <g transform="translate(480, 0)">
        <circle cx="8" cy="-5" r="4" fill="#8b5cf6" />
        <text x="20" y="0" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
          Auditor-Ready Workflows
        </text>
      </g>
    </g>
  </g>
</svg>
